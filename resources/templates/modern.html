<!-- @format -->

<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{LESSON_TITLE}}</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- MathJax để hiển thị công thức -->
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [
            ["$", "$"],
            ["\\(", "\\)"],
          ],
        },
        svg: { fontCache: "global" },
      };
    </script>
    <script
      id="MathJax-script"
      async
      src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
      /* Reset để tránh conflicts */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow-x: hidden;
      }

      /* Glassmorphism utilities */
      .glass-panel {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
      }

      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* Đảm bảo canvas responsive */
      canvas {
        max-width: 100%;
        height: auto;
        display: block;
      }

      /* Generated CSS từ AI sẽ được inject vào đây */
      {{CSS_CONTENT}}
    </style>
  </head>

  <body
    class="bg-gradient-to-br from-slate-50 via-blue-50 to-indigo-50 min-h-screen">
    <!-- Header Navigation -->
    <nav
      class="bg-white/90 backdrop-blur-lg border-b border-slate-200 shadow-sm sticky top-0 z-50">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">
          <div class="flex items-center gap-3">
            <span class="text-3xl">🧪</span>
            <div>
              <h1 class="text-lg font-bold text-slate-900 leading-tight">
                {{LESSON_TITLE}}
              </h1>
              <p class="text-xs text-slate-500">{{CHAPTER_TITLE}}</p>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button
              onclick="window.location.reload()"
              class="p-2 hover:bg-slate-100 rounded-lg text-slate-600 transition-colors"
              title="Tải lại trang">
              🔄
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Main Content Area - Không giới hạn chiều cao -->
    <main class="w-full min-h-screen py-6">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <!-- 
          AI-generated content sẽ được inject vào đây
          AI có toàn quyền control layout, không bị giới hạn
        -->
        {{HTML_CONTENT}}
      </div>
    </main>

    <!-- Helper Functions - Có sẵn cho AI sử dụng -->
    <script>
      /**
       * Cập nhật hiển thị lý thuyết/công thức
       * @param {Object} data - {equation, explanation, title}
       */
      window.updateTheory = data => {
        const container = document.getElementById("theory-content");
        if (!container) {
          console.warn("Element #theory-content not found");
          return;
        }

        const {
          equation = "",
          explanation = "",
          title = "Công thức",
        } = typeof data === "object"
          ? data
          : { equation: data, explanation: arguments[1] || "" };

        container.innerHTML = `
          <div class="bg-gradient-to-br from-blue-50 to-indigo-50 rounded-xl border border-blue-200 p-4 shadow-sm">
            <p class="text-xs font-bold text-blue-600 uppercase mb-2">${title}</p>
            <div class="bg-white rounded-lg p-3 shadow-inner">
              <div class="font-mono text-center text-lg text-slate-800">
                \\[ ${equation} \\]
              </div>
            </div>
            ${
              explanation
                ? `
              <div class="mt-3 text-sm text-slate-700 leading-relaxed">
                <span class="font-semibold text-blue-600">💡 Giải thích:</span>
                <p class="mt-1">${explanation}</p>
              </div>
            `
                : ""
            }
          </div>
        `;

        // Re-render MathJax
        if (window.MathJax && window.MathJax.typeset) {
          window.MathJax.typeset([container]);
        }
      };

      /**
       * Cập nhật bước đang active trong hướng dẫn
       * @param {number} stepIndex - Index của bước (0-based)
       */
      window.updateActiveStep = stepIndex => {
        const steps = document.querySelectorAll("#step-guide li");
        if (steps.length === 0) {
          console.warn("No steps found in #step-guide");
          return;
        }

        steps.forEach((li, idx) => {
          const dot = li.querySelector(".step-dot");
          const title = li.querySelector(".step-title");
          const desc = li.querySelector(".step-desc");

          if (!dot || !title || !desc) return;

          if (idx === stepIndex) {
            // Active
            dot.className =
              "step-dot absolute -left-3 top-1 w-6 h-6 rounded-full bg-gradient-to-br from-green-400 to-emerald-500 border-2 border-white shadow-lg shadow-green-500/50";
            title.className = "step-title font-bold text-base text-green-700";
            desc.className = "step-desc text-sm text-slate-700 mt-1";
          } else if (idx < stepIndex) {
            // Completed
            dot.className =
              "step-dot absolute -left-3 top-1 w-6 h-6 rounded-full bg-blue-500 border-2 border-white shadow-md";
            title.className = "step-title font-semibold text-sm text-blue-600";
            desc.className = "step-desc text-xs text-slate-500 mt-1";
          } else {
            // Pending
            dot.className =
              "step-dot absolute -left-3 top-1 w-6 h-6 rounded-full bg-slate-300 border-2 border-white";
            title.className = "step-title font-semibold text-sm text-slate-400";
            desc.className = "step-desc text-xs text-slate-400 mt-1";
          }
        });
      };

      /**
       * Khởi tạo danh sách các bước hướng dẫn
       * @param {Array} stepsArray - [{title, desc}, ...]
       */
      window.initSteps = stepsArray => {
        const ul = document.getElementById("step-guide");
        if (!ul) {
          console.warn("Element #step-guide not found");
          return;
        }

        ul.innerHTML = stepsArray
          .map(
            (step, idx) => `
          <li class="relative pl-8 pb-8 last:pb-0 group">
            ${
              idx < stepsArray.length - 1
                ? '<div class="absolute left-0 top-8 bottom-0 w-0.5 bg-slate-200"></div>'
                : ""
            }
            <span class="step-dot absolute -left-3 top-1 w-6 h-6 rounded-full bg-slate-300 border-2 border-white"></span>
            <h4 class="step-title font-semibold text-sm text-slate-400">${
              step.title
            }</h4>
            <p class="step-desc text-xs text-slate-400 mt-1">${step.desc}</p>
          </li>
        `
          )
          .join("");

        // Set first step as active
        window.updateActiveStep(0);
      };

      /**
       * Cập nhật trạng thái/thông báo
       * @param {string} message - Nội dung
       * @param {string} type - 'info'|'success'|'warning'|'error'
       */
      window.updateStatus = (message, type = "info") => {
        const statusEl = document.getElementById("status-message");
        if (!statusEl) return;

        const colors = {
          info: "bg-blue-50 text-blue-700 border-blue-200",
          success: "bg-green-50 text-green-700 border-green-200",
          warning: "bg-yellow-50 text-yellow-700 border-yellow-200",
          error: "bg-red-50 text-red-700 border-red-200",
        };

        const icons = {
          info: "ℹ️",
          success: "✅",
          warning: "⚠️",
          error: "❌",
        };

        statusEl.className = `px-4 py-2 rounded-lg border ${colors[type]} transition-all duration-300`;
        statusEl.innerHTML = `<span class="font-semibold">${icons[type]}</span> ${message}`;
      };
    </script>

    <!-- AI-generated JavaScript sẽ được inject vào đây -->
    <!--prettier-ignore-->
    <script>
      {{JS_CONTENT}}
    </script>
  </body>
</html>
